<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="Karik 的个人网站正在孵化中。作品集，请移步飞书文档查看。">
  <title>欢迎光临！｜Karik</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f4;
      --ink: #20211f;
      --muted: #62645f;
      --link: #285d4b;
      --link-hover: #173f32;
      --line: #e4e5de;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 22px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(220, 226, 213, 0.36), transparent 46%),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px) clamp(24px, 7vw, 58px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 252, 0.72);
      box-shadow: 0 18px 60px rgba(39, 43, 34, 0.045);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(27px, 5vw, 39px);
      line-height: 1.35;
      letter-spacing: -0.045em;
      font-weight: 650;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2.6vw, 18px);
      line-height: 2;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--link);
      text-decoration-color: rgba(40, 93, 75, 0.42);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 160ms ease, text-decoration-color 160ms ease;
    }

    a:hover {
      color: var(--link-hover);
      text-decoration-color: currentColor;
    }

    a:focus-visible {
      outline: 3px solid rgba(40, 93, 75, 0.35);
      outline-offset: 4px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>👋 欢迎光临！</h1>
    <p>本站正在孵化中……作品集，请移步<a href="https://my.feishu.cn/wiki/WV8VwyiuWiu9bykEI4Tcwp0tnRh" target="_blank" rel="noopener noreferrer">飞书文档</a>查看。</p>
  </main>
</body>
</html>
