    (function () {
      try {
        var saved = localStorage.getItem('karik_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      }
    })();

      // Automatic Browser/OS Theme Sync
      const darkMediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function applySystemTheme(isDark) {
        if (isDark) {
          htmlEl.classList.add('dark');
        } else {
          htmlEl.classList.remove('dark');
        }
      }

      if (darkMediaQuery) {
        const handleSystemThemeChange = function (e) {
          try {
            localStorage.removeItem('karik_theme');
          } catch (err) {}
          applySystemTheme(e.matches);
        };
        if (darkMediaQuery.addEventListener) {
          darkMediaQuery.addEventListener('change', handleSystemThemeChange);
        } else if (darkMediaQuery.addListener) {
          darkMediaQuery.addListener(handleSystemThemeChange);
        }
      }

      // Load '/2-inch.jpg' on deployed site, fallback to https://karik.wang/2-inch.jpg, then embedded preview
      let step = 0;
      userPortraitImg.addEventListener('error', function () {
        if (step === 0) {
          step = 1;
          userPortraitImg.src = 'https://karik.wang/2-inch.jpg';
        } else if (step === 1) {
          step = 2;
          userPortraitImg.src = fallbackAvatarDataUri;
        }
      });

      userPortraitImg.src = '/2-inch.jpg';
    })();
